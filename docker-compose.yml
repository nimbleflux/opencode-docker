services:
  opencode:
    image: ghcr.io/nimbleflux/opencode-docker:latest
    container_name: opencode
    ports:
      - "${OPENCODE_PORT:-4000}:4000"
    environment:
      # Password for the web UI and API (the username is always `opencode`). If unset, OpenCode
      # generates a new password on every start and prints it with `docker logs opencode`
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:-}
    volumes:
      # Persistent configuration (UI config saved here)
      - opencode-config:/home/opencode/.config/opencode

      # Session storage, cache, and auth credentials
      - opencode-data:/home/opencode/.local/share/opencode

      # Working directory for projects
      - opencode-workspace:/home/opencode/workspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  opencode-config:
    driver: local
  opencode-data:
    driver: local
  opencode-workspace:
    driver: local
