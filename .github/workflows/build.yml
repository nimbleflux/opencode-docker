name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Run every day at 9:00 UTC to check for new OpenCode versions
    - cron: '0 9 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nimbleflux/opencode-docker
  # jq filter for `gh release list --json tagName,isPrerelease`: the highest stable vX.Y.Z tag
  HIGHEST_STABLE_JQ: >-
    [.[] | select(.isPrerelease == false) | .tagName
    | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | ltrimstr("v")]
    | sort_by(split(".") | map(tonumber)) | last // ""

permissions:
  contents: write
  packages: write

jobs:
  check-version:
    name: Check for new OpenCode version
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.set_outputs.outputs.new_version }}
      should_release: ${{ steps.set_outputs.outputs.should_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get current released version
        id: current_version
        run: |
          set -o pipefail
          # Highest released OpenCode version so far (prereleases and non-semver tags are excluded)
          CURRENT_VERSION=$(gh release list --repo ${{ github.repository }} --limit 100 --json tagName,isPrerelease | jq -r "$HIGHEST_STABLE_JQ")
          CURRENT_VERSION=${CURRENT_VERSION:-none}
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch latest OpenCode version
        id: fetch_version
        # Always fetch on schedule/workflow_dispatch, or on push to main
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          set -o pipefail
          # Take the highest stable tag rather than the release flagged "Latest": upstream can
          # keep that flag on an older major (v1.19.6) while publishing newer ones (v2.x) unflagged
          LATEST_VERSION=$(gh release list --repo anomalyco/opencode --limit 100 --json tagName,isPrerelease | jq -r "$HIGHEST_STABLE_JQ")
          echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "Latest version: $LATEST_VERSION"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare versions
        id: version_check
        if: steps.fetch_version.outputs.latest_version != ''
        run: |
          LATEST="${{ steps.fetch_version.outputs.latest_version }}"
          CURRENT="${{ steps.current_version.outputs.current_version }}"

          echo "Latest OpenCode version: $LATEST"
          echo "Current Docker version: $CURRENT"

          if [ "$CURRENT" = "none" ] || [ "$LATEST" != "$CURRENT" ]; then
            echo "new_version=$LATEST" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "::notice::New version detected: $LATEST"
          else
            echo "new_version=" >> $GITHUB_OUTPUT
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "::notice::Already up to date"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set job outputs
        id: set_outputs
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "new_version=${{ steps.version_check.outputs.new_version }}" >> $GITHUB_OUTPUT
            echo "should_release=${{ steps.version_check.outputs.should_release }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ steps.version_check.outputs.should_release }}" = "true" ]; then
            echo "new_version=${{ steps.version_check.outputs.new_version }}" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "::notice::Creating release with version: ${{ steps.version_check.outputs.new_version }}"
          else
            echo "new_version=" >> $GITHUB_OUTPUT
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: check-version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine OpenCode version
        id: version
        run: |
          if [ "${{ needs.check-version.outputs.should_release }}" = "true" ]; then
            VERSION="${{ needs.check-version.outputs.new_version }}"
          else
            VERSION="latest"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        env:
          SHOULD_RELEASE: ${{ needs.check-version.outputs.should_release || 'false' }}
          NEW_VERSION: ${{ needs.check-version.outputs.new_version || '' }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != 'latest' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != 'latest' }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != 'latest' }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=OpenCode Docker
            org.opencontainers.image.description=Docker image for OpenCode AI coding assistant
            org.opencontainers.image.vendor=nimbleflux
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build candidate image
        uses: docker/build-push-action@v7
        with:
          context: .
          # Pushes go to a candidate tag; the real tags are promoted only after the smoke test passes
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OPENCODE_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test candidate image
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          EXPECTED="${{ steps.version.outputs.version }}"
          # Unpinned builds install npm's `latest`, so that is the version to expect
          if [ "$EXPECTED" = "latest" ]; then
            EXPECTED=$(curl -fsSL https://registry.npmjs.org/@opencode%2Fcli/latest | jq -r .version)
          fi
          echo "Expected OpenCode version: $EXPECTED"

          ACTUAL=$(docker run --rm --entrypoint opencode "$IMAGE" --version)
          echo "Installed OpenCode version: $ACTUAL"
          if [[ "$ACTUAL" != *"$EXPECTED"* ]]; then
            echo "::error::expected OpenCode $EXPECTED but the image reports '$ACTUAL'"
            exit 1
          fi

          # Start through the normal entrypoint and wait until every check holds at once.
          # /health needs no password but only proves the HTTP server answers, and API routes
          # can answer 503 for a moment during startup, so also wait for an authenticated call
          # to succeed and for a call without the password to be rejected
          URL=http://127.0.0.1:4173
          docker run -d --name opencode-smoke -p 127.0.0.1:4173:4000 -e OPENCODE_SERVER_PASSWORD=smoke-test "$IMAGE"
          READY=false
          for _ in $(seq 1 30); do
            # `|| true`: a failed request is a code of 000, not a reason to abort the step
            HEALTH=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' "$URL/health" || true)
            INFO=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' -u opencode:smoke-test "$URL/api/info" || true)
            WITH_PW=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' -u opencode:smoke-test "$URL/api/session" || true)
            NO_PW=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' "$URL/api/session" || true)
            if [ "$HEALTH$INFO$WITH_PW$NO_PW" = "200200200401" ]; then
              READY=true
              break
            fi
            sleep 2
          done
          if [ "$READY" != true ]; then
            echo "::error::server did not reach the expected state (need /health=200, API with password=200, API without password=401). Got health=$HEALTH info=$INFO with-password=$WITH_PW without-password=$NO_PW. Container logs:"
            docker logs opencode-smoke
            exit 1
          fi
          echo "Server is ready"

          RUNNING=$(curl -fsS -u opencode:smoke-test "$URL/api/info" | jq -r .version)
          echo "Running OpenCode version: $RUNNING"
          if [ "$RUNNING" != "$EXPECTED" ]; then
            echo "::error::the running server reports '$RUNNING', expected $EXPECTED"
            exit 1
          fi

      - name: Remove smoke test container
        if: always()
        run: docker rm -f opencode-smoke || true

      - name: Promote tested image
        if: github.event_name != 'pull_request'
        env:
          # Passed as a variable because the value is multi-line: an inline ${{ }} would be
          # pasted into the script as several lines and break the loop
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          # One tag per line, `latest` last; sort -u drops the duplicate the metadata adds
          while IFS= read -r tag; do
            docker buildx imagetools create --tag "$tag" "$IMAGE"
          done <<< "$(printf '%s\n' "$TAGS" | sort -u)"

  release:
    name: Create GitHub Release
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    needs: [check-version, build]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract version info
        id: version
        run: |
          VERSION="${{ needs.check-version.outputs.new_version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Extract major and major.minor for additional tags
          IFS='.' read -ra VERSION_PARTS <<< "$VERSION"
          echo "major=${VERSION_PARTS[0]}" >> $GITHUB_OUTPUT
          echo "major_minor=${VERSION_PARTS[0]}.${VERSION_PARTS[1]}" >> $GITHUB_OUTPUT

      - name: Fetch OpenCode release notes
        id: release_notes
        run: |
          RELEASE_BODY=$(gh release view v${{ steps.version.outputs.version }} --repo anomalyco/opencode --json body --jq '.body')
          # Add to output (truncate if too long for GitHub Actions)
          EOF=$(dd if=/dev/urandom bs=1 count=32 2>/dev/null | base64)
          echo "release_notes<<$EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_BODY" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: OpenCode Docker ${{ steps.version.outputs.version }}
          body: |
            ## OpenCode Docker Image ${{ steps.version.outputs.version }}

            This release tracks [OpenCode v${{ steps.version.outputs.version }}](https://github.com/anomalyco/opencode/releases/tag/v${{ steps.version.outputs.version }}).

            ### Docker Image

            Pull this version:
            ```bash
            docker pull ghcr.io/nimbleflux/opencode-docker:${{ steps.version.outputs.version }}
            ```

            Or use latest:
            ```bash
            docker pull ghcr.io/nimbleflux/opencode-docker:latest
            ```

            ### Quick Start

            ```bash
            docker run -p 4000:4000 ghcr.io/nimbleflux/opencode-docker:${{ steps.version.outputs.version }}
            ```

            ### Available Tags

            - `${{ steps.version.outputs.version }}` - This specific version
            - `${{ steps.version.outputs.major }}` - Major version
            - `${{ steps.version.outputs.major_minor }}` - Major.Minor version
            - `latest` - Latest stable release

            ---

            ### OpenCode Release Notes

            ${{ steps.release_notes.outputs.release_notes }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
